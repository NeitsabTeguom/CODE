# ESP32-S3 built-in USB-JTAG, bare-metal (Route B amc runtime, no FreeRTOS)
adapter driver esp_usb_jtag
espusbjtag vid_pid 0x303a 0x1001
espusbjtag caps_descriptor 1
adapter speed 40000
transport select jtag
set ESP_RTOS none
source [find /home/neitsab/.platformio/packages/tool-openocd/openocd/scripts/target/esp32s3.cfg]
