name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual trigger for testing the workflow without cutting a real release
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.4.0)'
        required: true
        default: 'v0.0.0-test'

jobs:
  # The .vsix is gitignored (binary blob shouldn't live in the repo), so we
  # build it once with vsce here and share through an artifact. The three
  # platform jobs download it and drop it under share/amalgame/editors/vscode/
  # in their respective tarballs so install.sh / build-msi.ps1 can auto-install
  # the extension without a network round-trip.
  build-vsix:
    name: Build VS Code extension .vsix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: vsce package
        working-directory: editors/vscode
        run: |
          npm install --no-audit --no-fund
          npx --yes @vscode/vsce package
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension-vsix
          path: editors/vscode/amalgame-*.vsix
          retention-days: 7

  # Each platform builds its own amc binary, packages it with the runtime
  # header + docs, and uploads the resulting archive as a workflow artifact.
  # The final job downloads everything and creates the GitHub Release.

  build-linux:
    name: Build (Linux x86_64)
    runs-on: ubuntu-latest
    needs: build-vsix
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download VS Code extension .vsix
        uses: actions/download-artifact@v4
        with:
          name: vscode-extension-vsix
          path: editors/vscode/

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            gcc libgc-dev

      - name: Build amc (snapshot-driven bootstrap)
        run: |
          # libcurl dropped in v0.8.31 — amc links only libgc + libc now.
          gcc -O2 -Iruntime snapshot/amc_lib.c \
              -lgc -lm -o snapshot/amc
          ./build_amc.sh

      - name: Determine version
        id: ver
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          if [ -z "${REF#refs/*}" ] || [ "$REF" = "$GITHUB_REF" ]; then
            REF="${{ github.event.inputs.tag }}"
          fi
          VERSION="${REF#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building amc-$VERSION-linux-x86_64"

      - name: Stage release artifacts
        run: |
          NAME="amc-${{ steps.ver.outputs.version }}-linux-x86_64"
          # XDG-style layout (v0.8.1+): the tarball mirrors the
          # install-prefix tree so installers (install/install.sh,
          # install/windows/build-msi.ps1) can `cp -r $NAME/* $PREFIX/`
          # with no per-file rewiring. amc's Program.ResolveRuntimeDir /
          # ResolveLibAmalgameA probe <bin>/../share/amalgame/{runtime,lib}
          # — match that exactly so $AMC_RUNTIME stays an opt-in
          # override, not a hard requirement.
          mkdir -p "dist/$NAME/bin"
          mkdir -p "dist/$NAME/share/amalgame/runtime"
          mkdir -p "dist/$NAME/share/amalgame/lib"
          mkdir -p "dist/$NAME/share/amalgame/stdlib"
          mkdir -p "dist/$NAME/share/amalgame/docs/language"
          mkdir -p "dist/$NAME/share/amalgame/docs/guide"
          mkdir -p "dist/$NAME/share/amalgame/editors/vscode"
          cp amc                              "dist/$NAME/bin/"
          cp runtime/*.h                      "dist/$NAME/share/amalgame/runtime/"
          # Project F (v0.7.5+): pre-compiled user-facing stdlib.
          # build_amc.sh ran tools/build-stdlib.sh as Step 4, so
          # lib/libamalgame.a is already on disk.
          cp lib/libamalgame.a                "dist/$NAME/share/amalgame/lib/"
          # Bug 6 fix (v0.8.26+): ship the bundled-stdlib .am sources
          # so `amc build` can auto-attach them as `--external` when
          # user code does `import Amalgame.Formats.Json` etc.
          # Without this, the cgen has no way to learn the right
          # namespace mangling for JsonValue / TomlValue / MsgPack and
          # falls back to the consumer's NsPrefix.
          cp src/stdlib/json.am               "dist/$NAME/share/amalgame/stdlib/"
          cp src/stdlib/toml.am               "dist/$NAME/share/amalgame/stdlib/"
          cp src/stdlib/msgpack.am            "dist/$NAME/share/amalgame/stdlib/"
          cp src/stdlib/path.am               "dist/$NAME/share/amalgame/stdlib/"
          cp src/stdlib/amc_buildinfo.am      "dist/$NAME/share/amalgame/stdlib/"
          cp README.md LICENSE                "dist/$NAME/"
          # Bundle the LLM-prompt source docs so `amc migrate / generate /
          # explain` find them at <exec-dir>/../share/amalgame/docs/...
          # (LoadDocsHeader lookup #1). Without these, the LLM commands
          # fall back to an inline conventions block — still functional
          # but the model loses access to the canonical grammar.
          cp docs/language/grammar.ebnf       "dist/$NAME/share/amalgame/docs/language/"
          # Ship the whole user guide (all chapters + 09-ui-web/) so it
          # can be read offline at <prefix>/share/amalgame/docs/guide/.
          # 02-language-tour.md is included in the copy, so the LLM
          # commands still find it here too.
          cp -r docs/guide/.                  "dist/$NAME/share/amalgame/docs/guide/"
          # Latest VS Code extension .vsix — install.sh /
          # postinstall.ps1 auto-install it on detected editors so users
          # land on a working LSP + debug setup without extra steps.
          LATEST_VSIX=$(ls -1 editors/vscode/amalgame-*.vsix | sort -V | tail -n1)
          cp "$LATEST_VSIX" "dist/$NAME/share/amalgame/editors/vscode/"
          tar -czf "dist/$NAME.tar.gz" -C dist "$NAME"
          (cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 7

  # Native aarch64 build on GitHub's free `ubuntu-24.04-arm` runner.
  # Produces the `linux-arm64` tarball that install.sh already expects
  # for Raspberry Pi OS 64-bit / other aarch64 Linux (uname -m =
  # aarch64). Mirrors build-linux step-for-step — the snapshot bootstrap
  # is portable C, so no QEMU and no per-arch source changes.
  build-linux-arm64:
    name: Build (Linux ARM64)
    runs-on: ubuntu-24.04-arm
    needs: build-vsix
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download VS Code extension .vsix
        uses: actions/download-artifact@v4
        with:
          name: vscode-extension-vsix
          path: editors/vscode/

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            gcc libgc-dev

      - name: Build amc (snapshot-driven bootstrap)
        run: |
          # libcurl dropped in v0.8.31 — amc links only libgc + libc now.
          gcc -O2 -Iruntime snapshot/amc_lib.c \
              -lgc -lm -o snapshot/amc
          ./build_amc.sh

      - name: Determine version
        id: ver
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          if [ -z "${REF#refs/*}" ] || [ "$REF" = "$GITHUB_REF" ]; then
            REF="${{ github.event.inputs.tag }}"
          fi
          VERSION="${REF#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building amc-$VERSION-linux-arm64"

      - name: Stage release artifacts
        run: |
          NAME="amc-${{ steps.ver.outputs.version }}-linux-arm64"
          # XDG-style layout — see build-linux for the rationale.
          mkdir -p "dist/$NAME/bin"
          mkdir -p "dist/$NAME/share/amalgame/runtime"
          mkdir -p "dist/$NAME/share/amalgame/lib"
          mkdir -p "dist/$NAME/share/amalgame/stdlib"
          mkdir -p "dist/$NAME/share/amalgame/docs/language"
          mkdir -p "dist/$NAME/share/amalgame/docs/guide"
          mkdir -p "dist/$NAME/share/amalgame/editors/vscode"
          cp amc                              "dist/$NAME/bin/"
          cp runtime/*.h                      "dist/$NAME/share/amalgame/runtime/"
          cp lib/libamalgame.a                "dist/$NAME/share/amalgame/lib/"
          cp src/stdlib/json.am               "dist/$NAME/share/amalgame/stdlib/"
          cp src/stdlib/toml.am               "dist/$NAME/share/amalgame/stdlib/"
          cp src/stdlib/msgpack.am            "dist/$NAME/share/amalgame/stdlib/"
          cp src/stdlib/path.am               "dist/$NAME/share/amalgame/stdlib/"
          cp src/stdlib/amc_buildinfo.am      "dist/$NAME/share/amalgame/stdlib/"
          cp README.md LICENSE                "dist/$NAME/"
          cp docs/language/grammar.ebnf       "dist/$NAME/share/amalgame/docs/language/"
          cp docs/guide/02-language-tour.md   "dist/$NAME/share/amalgame/docs/guide/"
          LATEST_VSIX=$(ls -1 editors/vscode/amalgame-*.vsix | sort -V | tail -n1)
          cp "$LATEST_VSIX" "dist/$NAME/share/amalgame/editors/vscode/"
          tar -czf "dist/$NAME.tar.gz" -C dist "$NAME"
          (cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-arm64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 7

  build-macos:
    name: Build (macOS arm64)
    runs-on: macos-latest
    needs: build-vsix
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download VS Code extension .vsix
        uses: actions/download-artifact@v4
        with:
          name: vscode-extension-vsix
          path: editors/vscode/

      - name: Install build dependencies
        # libcurl dropped in v0.8.31 — amc links only libgc + libc now.
        run: brew install bdw-gc

      - name: Stamp build provenance into amc_buildinfo.am
        # build_amc.sh's Step 0 normally does this from the .am.in
        # template; the macOS job uses the pre-generated src/amc_lib.c
        # directly so we replicate the substitution by hand here.
        run: |
          BI_GIT_REV=$(git rev-parse --short=8 HEAD 2>/dev/null || echo "")
          BI_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || echo "")
          sed -e "s|__GIT_REV__|$BI_GIT_REV|g" \
              -e "s|__BUILD_DATE__|$BI_BUILD_DATE|g" \
              src/stdlib/amc_buildinfo.am.in > src/stdlib/amc_buildinfo.am

      - name: Build amc from tracked amc_lib.c
        run: |
          GC_PREFIX=$(brew --prefix bdw-gc)
          gcc -O2 -Iruntime -I"$GC_PREFIX/include" \
              -L"$GC_PREFIX/lib" \
              src/amc_lib.c \
              -lgc -lm -o amc

      - name: Pre-compile user-facing stdlib (libamalgame.a)
        run: |
          GC_PREFIX=$(brew --prefix bdw-gc)
          # tools/build-stdlib.sh defaults to plain `gcc -O2 -Iruntime`;
          # the macOS runner needs the homebrew prefix spliced in.
          export CPPFLAGS="-I$GC_PREFIX/include"
          export LDFLAGS="-L$GC_PREFIX/lib"
          ./tools/build-stdlib.sh

      - name: Determine version
        id: ver
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          if [ "$REF" = "$GITHUB_REF" ]; then
            REF="${{ github.event.inputs.tag }}"
          fi
          VERSION="${REF#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stage release artifacts
        run: |
          NAME="amc-${{ steps.ver.outputs.version }}-macos-arm64"
          # XDG-style layout — see linux job for rationale.
          mkdir -p "dist/$NAME/bin"
          mkdir -p "dist/$NAME/share/amalgame/runtime"
          mkdir -p "dist/$NAME/share/amalgame/lib"
          mkdir -p "dist/$NAME/share/amalgame/stdlib"
          mkdir -p "dist/$NAME/share/amalgame/docs/language"
          mkdir -p "dist/$NAME/share/amalgame/docs/guide"
          mkdir -p "dist/$NAME/share/amalgame/editors/vscode"
          cp amc                              "dist/$NAME/bin/"
          cp runtime/*.h                      "dist/$NAME/share/amalgame/runtime/"
          cp lib/libamalgame.a                "dist/$NAME/share/amalgame/lib/"
          # Bug 6 fix (v0.8.26+): see linux job for rationale.
          cp src/stdlib/json.am               "dist/$NAME/share/amalgame/stdlib/"
          cp src/stdlib/toml.am               "dist/$NAME/share/amalgame/stdlib/"
          cp src/stdlib/msgpack.am            "dist/$NAME/share/amalgame/stdlib/"
          cp src/stdlib/path.am               "dist/$NAME/share/amalgame/stdlib/"
          cp src/stdlib/amc_buildinfo.am      "dist/$NAME/share/amalgame/stdlib/"
          cp README.md LICENSE                "dist/$NAME/"
          cp docs/language/grammar.ebnf       "dist/$NAME/share/amalgame/docs/language/"
          # Ship the whole user guide (all chapters + 09-ui-web/) so it
          # can be read offline at <prefix>/share/amalgame/docs/guide/.
          # 02-language-tour.md is included in the copy, so the LLM
          # commands still find it here too.
          cp -r docs/guide/.                  "dist/$NAME/share/amalgame/docs/guide/"
          LATEST_VSIX=$(ls -1 editors/vscode/amalgame-*.vsix | sort -V | tail -n1)
          cp "$LATEST_VSIX" "dist/$NAME/share/amalgame/editors/vscode/"
          tar -czf "dist/$NAME.tar.gz" -C dist "$NAME"
          (cd dist && shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 7

  build-windows:
    name: Build (Windows x86_64)
    runs-on: windows-latest
    needs: build-vsix
    timeout-minutes: 15
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Download VS Code extension .vsix
        uses: actions/download-artifact@v4
        with:
          name: vscode-extension-vsix
          path: editors/vscode/

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # libcurl + libsystre + zlib were needed when Http_* / Regex
          # / Compress lived in amc's bundled runtime. Since those
          # moved to external packages (v0.7.8 + v0.8.31), amc only
          # needs gcc + libgc.
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gc
            zip

      - name: Determine version
        id: ver
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          if [ "$REF" = "$GITHUB_REF" ]; then
            REF="${{ github.event.inputs.tag }}"
          fi
          VERSION="${REF#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stamp build provenance into amc_buildinfo.am
        # build_amc.sh's Step 0 normally does this from the .am.in
        # template; the Windows job uses the pre-generated src/amc_lib.c
        # directly so we replicate the substitution by hand here.
        run: |
          BI_GIT_REV=$(git rev-parse --short=8 HEAD 2>/dev/null || echo "")
          BI_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || echo "")
          sed -e "s|__GIT_REV__|$BI_GIT_REV|g" \
              -e "s|__BUILD_DATE__|$BI_BUILD_DATE|g" \
              src/stdlib/amc_buildinfo.am.in > src/stdlib/amc_buildinfo.am

      - name: Compile Windows resource file (VERSIONINFO + icon)
        # Substitute version + year into amc.rc.in, then run windres
        # (ships with MinGW) to produce amc-res.o. Linking that .o into
        # amc.exe stamps the binary with the metadata Explorer shows
        # under Properties → Details + the application icon.
        run: |
          V="${{ steps.ver.outputs.version }}"
          # 0.8.43 → 0,8,43,0 (FILEVERSION binary form needs 4 components)
          V_COMMA=$(echo "$V" | awk -F. '{ printf "%d,%d,%d,%d", $1, $2, $3, ($4=="" ? 0 : $4) }')
          V_DOTTED="${V}.0"
          YEAR=$(date -u +%Y)
          # Copy the .ico next to the .rc so the `1 ICON "amalgame.ico"`
          # directive resolves; windres looks relative to the .rc file.
          cp install/windows/assets/amalgame.ico amalgame.ico
          sed -e "s|__VERSION_COMMA__|$V_COMMA|g" \
              -e "s|__VERSION_DOTTED__|$V_DOTTED|g" \
              -e "s|__YEAR__|$YEAR|g" \
              install/windows/amc.rc.in > amc.rc
          windres amc.rc -O coff -o amc-res.o
          ls -l amc-res.o

      - name: Build amc.exe from tracked amc_lib.c
        run: |
          # Link the resource object so Explorer / AV scanners see the
          # version metadata + icon embedded in the PE.
          gcc -O2 -Iruntime \
              src/amc_lib.c amc-res.o \
              -lgc -lm -lws2_32 -lbcrypt -o amc.exe

      - name: Pre-compile user-facing stdlib (libamalgame.a)
        run: |
          # tools/build-stdlib.sh auto-detects ./amc vs ./amc.exe.
          ./tools/build-stdlib.sh

      - name: Stage release artifacts
        run: |
          NAME="amc-${{ steps.ver.outputs.version }}-windows-x86_64"
          # XDG-style layout — see linux job for rationale.
          # Note: DLLs live alongside amc.exe in bin/ so the Windows
          # loader's default search path picks them up automatically
          # (current dir + PATH dirs; "bin/" being the only PATH dir
          # we install into keeps the resolution unambiguous).
          mkdir -p "dist/$NAME/bin"
          mkdir -p "dist/$NAME/share/amalgame/runtime"
          mkdir -p "dist/$NAME/share/amalgame/lib"
          mkdir -p "dist/$NAME/share/amalgame/stdlib"
          mkdir -p "dist/$NAME/share/amalgame/docs/language"
          mkdir -p "dist/$NAME/share/amalgame/docs/guide"
          mkdir -p "dist/$NAME/share/amalgame/editors/vscode"
          cp amc.exe                          "dist/$NAME/bin/"
          cp runtime/*.h                      "dist/$NAME/share/amalgame/runtime/"
          cp lib/libamalgame.a                "dist/$NAME/share/amalgame/lib/"
          # Bug 6 fix (v0.8.26+): see linux job for rationale.
          cp src/stdlib/json.am               "dist/$NAME/share/amalgame/stdlib/"
          cp src/stdlib/toml.am               "dist/$NAME/share/amalgame/stdlib/"
          cp src/stdlib/msgpack.am            "dist/$NAME/share/amalgame/stdlib/"
          cp src/stdlib/path.am               "dist/$NAME/share/amalgame/stdlib/"
          cp src/stdlib/amc_buildinfo.am      "dist/$NAME/share/amalgame/stdlib/"
          cp README.md LICENSE                "dist/$NAME/"
          cp docs/language/grammar.ebnf       "dist/$NAME/share/amalgame/docs/language/"
          # Ship the whole user guide (all chapters + 09-ui-web/) so it
          # can be read offline at <prefix>/share/amalgame/docs/guide/.
          # 02-language-tour.md is included in the copy, so the LLM
          # commands still find it here too.
          cp -r docs/guide/.                  "dist/$NAME/share/amalgame/docs/guide/"
          LATEST_VSIX=$(ls -1 editors/vscode/amalgame-*.vsix | sort -V | tail -n1)
          cp "$LATEST_VSIX" "dist/$NAME/share/amalgame/editors/vscode/"
          # Bundle every MinGW DLL the binary transitively links against,
          # so users can run amc.exe without a separate MSYS2 install.
          # Dynamic resolution via `ldd` — previous hardcoded list broke
          # whenever MSYS2 renamed a transitive dep (e.g. v0.8.3 shipped
          # libngtcp2_crypto_quictls.dll, but the runner's curl now needs
          # libngtcp2_crypto_ossl-0.dll). Recursive walk: amc.exe → its
          # /mingw64/bin/ deps → each new dep's /mingw64/bin/ deps, until
          # the closure converges.
          copy_mingw_deps() {
            local bin="$1"
            ldd "$bin" 2>/dev/null | awk '/\/mingw64\/bin\// {print $3}' | \
              while read -r dep; do
                local base
                base=$(basename "$dep")
                local target="dist/$NAME/bin/$base"
                if [ ! -f "$target" ]; then
                  cp "$dep" "$target"
                  copy_mingw_deps "$target"
                fi
              done
          }
          copy_mingw_deps amc.exe
          echo "Bundled $(ls "dist/$NAME/bin/"*.dll 2>/dev/null | wc -l) MinGW DLLs:"
          ls "dist/$NAME/bin/"*.dll | xargs -n1 basename | sort
          (cd dist && zip -r "$NAME.zip" "$NAME")
          (cd dist && sha256sum "$NAME.zip" > "$NAME.zip.sha256")
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64
          path: |
            dist/*.zip
            dist/*.sha256
          retention-days: 7

  # Builds the Inno Setup .exe installer on top of the staged Windows tarball.
  # Runs natively on windows-latest (default pwsh) so choco + ISCC.exe work
  # without the msys2 wrapper the build-windows job uses. The installer
  # bundles a winlibs MinGW-w64 toolchain so `amc build` works on a fresh
  # box without MSYS2 — the same opt-in path documented in PUBLISHING.md.
  build-windows-installer:
    name: Build Windows .exe installer
    runs-on: windows-latest
    needs: build-windows
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}".Replace("refs/tags/", "")
          if ("$ref" -eq "${{ github.ref }}") { $ref = "${{ github.event.inputs.tag }}" }
          $version = $ref -replace '^v',''
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building installer for amc-$version"

      - name: Download Windows zip artifact
        uses: actions/download-artifact@v4
        with:
          name: release-windows-x86_64
          path: dist/

      - name: Extract Windows zip into staging tree
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath dist
          Get-ChildItem dist -Directory

      - name: Download winlibs MinGW-w64 (gcc-bundle source)
        shell: pwsh
        run: |
          # UCRT runtime, POSIX threads, SEH exceptions, GCC 13.2.0 —
          # matches what the build-windows job actually links against
          # (MSYS2 MINGW64), so the bundled gcc produces ABI-compatible
          # binaries with the bundled DLLs in {app}\bin.
          $url = 'https://github.com/brechtsanders/winlibs_mingw/releases/download/13.2.0posix-17.0.6-11.0.1-ucrt-r5/winlibs-x86_64-posix-seh-gcc-13.2.0-mingw-w64ucrt-11.0.1-r5.zip'
          Invoke-WebRequest -Uri $url -OutFile mingw.zip -UseBasicParsing
          Expand-Archive mingw.zip -DestinationPath winlibs-tmp
          # winlibs.zip extracts to mingw64/{bin,lib,...} — move it under
          # install/windows/gcc-bundle so the MSI builder picks it up.
          Move-Item winlibs-tmp\mingw64 install\windows\gcc-bundle
          Remove-Item -Recurse -Force winlibs-tmp, mingw.zip
          Test-Path install\windows\gcc-bundle\bin\gcc.exe

      - name: Trim gcc-bundle (drop C++/Fortran/Ada/Go/docs)
        shell: pwsh
        run: |
          # amc only ever shells out to `gcc` to compile C. We can drop
          # every other language frontend + their runtimes + docs and
          # still produce identical .exe output. Net: ~500 MB → ~150 MB.
          $bundle = "install\windows\gcc-bundle"
          $before = (Get-ChildItem -Recurse -File $bundle | Measure-Object Length -Sum).Sum
          Write-Host ("  before trim: {0:N0} MB" -f ($before / 1MB))

          # 1. Docs/man/info/locale — pure dead weight at install time.
          foreach ($d in 'share\doc','share\man','share\info','share\locale','share\gcc-*') {
            Remove-Item -Recurse -Force "$bundle\$d" -ErrorAction SilentlyContinue
          }

          # 2. C++ frontend: driver, cc1plus, libstdc++, headers.
          Remove-Item -Force "$bundle\bin\g++.exe","$bundle\bin\c++.exe","$bundle\bin\x86_64-w64-mingw32-g++.exe","$bundle\bin\x86_64-w64-mingw32-c++.exe" -ErrorAction SilentlyContinue
          Get-ChildItem -Path $bundle -Filter "libstdc++*" -Recurse -File | Remove-Item -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path $bundle -Filter "libsupc++*" -Recurse -File | Remove-Item -Force -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$bundle\include\c++" -ErrorAction SilentlyContinue
          Get-ChildItem -Path $bundle\libexec -Recurse -Filter "cc1plus.exe" | Remove-Item -Force -ErrorAction SilentlyContinue

          # 3. Fortran frontend + runtime.
          Remove-Item -Force "$bundle\bin\gfortran.exe","$bundle\bin\x86_64-w64-mingw32-gfortran.exe" -ErrorAction SilentlyContinue
          Get-ChildItem -Path $bundle -Filter "libgfortran*" -Recurse -File | Remove-Item -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path $bundle\libexec -Recurse -Filter "f951.exe" | Remove-Item -Force -ErrorAction SilentlyContinue

          # 4. Ada frontend + runtime.
          Get-ChildItem -Path $bundle\bin -Filter "gnat*.exe" -File | Remove-Item -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path $bundle -Filter "libgnat*" -Recurse -File | Remove-Item -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path $bundle\libexec -Recurse -Filter "gnat1.exe" | Remove-Item -Force -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$bundle\include\ada" -ErrorAction SilentlyContinue
          Get-ChildItem -Path $bundle -Filter "adainclude" -Recurse -Directory | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path $bundle -Filter "adalib" -Recurse -Directory | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          # 5. Go frontend.
          Remove-Item -Force "$bundle\bin\gccgo.exe","$bundle\bin\go.exe","$bundle\bin\gofmt.exe","$bundle\bin\x86_64-w64-mingw32-gccgo.exe" -ErrorAction SilentlyContinue
          Get-ChildItem -Path $bundle -Filter "libgo*" -Recurse -File | Remove-Item -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path $bundle\libexec -Recurse -Filter "go1.exe" | Remove-Item -Force -ErrorAction SilentlyContinue

          # 6. Objective-C frontend (cc1obj).
          Get-ChildItem -Path $bundle\libexec -Recurse -Filter "cc1obj*.exe" | Remove-Item -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path $bundle -Filter "libobjc*" -Recurse -File | Remove-Item -Force -ErrorAction SilentlyContinue

          # 7. install-tools and plugin headers (install-time only / dev only).
          Get-ChildItem -Path $bundle -Filter "install-tools" -Recurse -Directory | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path $bundle\lib\gcc -Filter "plugin" -Recurse -Directory | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          $after = (Get-ChildItem -Recurse -File $bundle | Measure-Object Length -Sum).Sum
          Write-Host ("  after  trim: {0:N0} MB" -f ($after / 1MB))
          Write-Host ("  saved      : {0:N0} MB" -f (($before - $after) / 1MB))
          # Sanity check: gcc.exe and ld.exe must survive.
          if (-not (Test-Path "$bundle\bin\gcc.exe")) { throw "trim ate gcc.exe!" }
          if (-not (Test-Path "$bundle\bin\ld.exe"))  { throw "trim ate ld.exe!" }

      - name: Build + bundle Boehm GC into gcc-bundle (so `amc build` links out of the box)
        shell: pwsh
        run: |
          # amc emits C that #include <gc.h> and links -lgc (Boehm GC). The
          # vanilla winlibs toolchain ships no GC, so a freshly-installed amc
          # could compile but not LINK on Windows. Prebuilt MSYS2 libgc.a is
          # NOT ABI-compatible with the winlibs CRT (undefined __imp__setjmp:
          # a different mingw-w64 runtime). So we BUILD bdwgc from source with
          # *the bundled winlibs gcc itself* — guaranteed ABI match — as a
          # static lib using GCC's builtin atomics (no libatomic_ops). Static
          # keeps amc-built .exe self-sufficient (no gc.dll), paired with the
          # GC_NOT_DLL define in runtime/_runtime.h.
          $ErrorActionPreference = "Stop"
          $bundle = (Resolve-Path "install\windows\gcc-bundle").Path
          $env:PATH = "$bundle\bin;$env:PATH"   # use the bundled gcc, not any other
          gcc --version | Select-Object -First 1 | Write-Host
          $gcVer = "8.2.8"
          Invoke-WebRequest "https://github.com/ivmai/bdwgc/releases/download/v$gcVer/gc-$gcVer.tar.gz" -OutFile gc.tar.gz -UseBasicParsing
          tar -xzf gc.tar.gz
          $src = "gc-$gcVer"
          cmake -S $src -B gc-build -G Ninja `
            -DCMAKE_C_COMPILER=gcc `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=OFF `
            -Denable_threads=ON `
            -Denable_cplusplus=OFF `
            -Dwithout_libatomic_ops=ON `
            -DCMAKE_INSTALL_PREFIX=gc-inst 2>&1 | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "cmake configure (bdwgc) failed" }
          cmake --build gc-build --config Release 2>&1 | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "cmake build (bdwgc) failed" }
          cmake --install gc-build 2>&1 | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "cmake install (bdwgc) failed" }
          $libgc = Get-ChildItem gc-inst, gc-build -Recurse -Filter 'libgc.a' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $libgc) { throw "libgc.a not produced by bdwgc build" }
          Copy-Item $libgc.FullName "$bundle\lib\libgc.a" -Force
          # Headers: prefer the installed include tree (canonical gc.h + gc/).
          if (Test-Path "gc-inst\include") { Copy-Item "gc-inst\include\*" "$bundle\include\" -Recurse -Force }
          else { Copy-Item "$src\include\*" "$bundle\include\" -Recurse -Force }
          if (-not (Test-Path "$bundle\include\gc.h")) { throw "gc.h missing after install" }
          Write-Host "✓ built+grafted static libgc.a ($((Get-Item "$bundle\lib\libgc.a").Length) bytes), gc.h present"

      - name: Smoke-test the bundled GC (static link + run)
        shell: pwsh
        run: |
          # Prove the grafted GC actually links and runs with the bundled
          # gcc — fail the release here rather than ship a broken toolchain.
          $bundle = "install\windows\gcc-bundle"
          $gcc = "$bundle\bin\gcc.exe"
          @'
          #include <gc.h>
          #include <stdio.h>
          int main(void) {
              GC_INIT();
              for (int i = 0; i < 1000; i++) { (void) GC_MALLOC(64); }
              void* p = GC_MALLOC(64);
              printf("%s\n", p ? "GC_OK" : "GC_FAIL");
              return p ? 0 : 1;
          }
          '@ | Set-Content -Encoding ascii smoke_gc.c
          # GC_NOT_DLL mirrors runtime/_runtime.h: link the static libgc.a.
          & $gcc -DGC_NOT_DLL smoke_gc.c -lgc -lpthread -o smoke_gc.exe 2>&1 | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "GC static link failed (gcc)" }
          $out = (& .\smoke_gc.exe) 2>&1
          Write-Host "smoke output: $out"
          if ($out -ne "GC_OK") { throw "GC smoke test did not print GC_OK (got: $out)" }
          Write-Host "✓ Boehm GC links statically and runs with the bundled gcc"

      - name: Build amalgame-<ver>.msi (pure-PowerShell)
        shell: pwsh
        working-directory: install\windows
        # Pure-PowerShell MSI builder, validated locally end-to-end
        # (dual-mode default-per-user). On clean GH runners there's no
        # file-lock contention from a previous .msi, so the canonical
        # output path lands first try.
        # -IncludeGccBundle: package the winlibs MinGW-w64 toolchain
        # downloaded above under share/amalgame/gcc/, so `amc build`
        # works out of the box on machines that don't already have gcc.
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $stage = "..\..\dist\amc-$version-windows-x86_64"
          .\build-msi.ps1 -Version $version -StageDir $stage -IncludeGccBundle
          Get-ChildItem Output

      - name: Hash the installers for checksums
        shell: pwsh
        working-directory: install\windows\Output
        run: |
          Get-ChildItem *.msi -ErrorAction SilentlyContinue | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Encoding ascii "$($_.Name).sha256"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-installer
          path: |
            install/windows/Output/*.msi
            install/windows/Output/*.sha256
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [build-linux, build-linux-arm64, build-macos, build-windows, build-windows-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR dist/

      - name: Aggregate checksums
        # Build checksums.sha256 in /tmp first, then move into dist/, so the
        # output file can never appear in the *.sha256 input glob (which
        # would make `cat` refuse with "input file is output file" — happens
        # on workflow re-runs that find an aggregate already in place).
        run: |
          rm -f dist/checksums.sha256
          cat dist/*.sha256 > /tmp/checksums.sha256
          mv /tmp/checksums.sha256 dist/checksums.sha256
          cat dist/checksums.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Amalgame ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.msi
            dist/checksums.sha256
