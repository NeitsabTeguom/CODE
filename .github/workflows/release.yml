name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual trigger for testing the workflow without cutting a real release
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.4.0)'
        required: true
        default: 'v0.0.0-test'

jobs:
  # The .vsix is gitignored (binary blob shouldn't live in the repo), so we
  # build it once with vsce here and share through an artifact. The three
  # platform jobs download it and drop it under share/amalgame/editors/vscode/
  # in their respective tarballs so install.sh / amalgame.iss can auto-install
  # the extension without a network round-trip.
  build-vsix:
    name: Build VS Code extension .vsix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: vsce package
        working-directory: editors/vscode
        run: |
          npm install --no-audit --no-fund
          npx --yes @vscode/vsce package
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension-vsix
          path: editors/vscode/amalgame-*.vsix
          retention-days: 7

  # Each platform builds its own amc binary, packages it with the runtime
  # header + docs, and uploads the resulting archive as a workflow artifact.
  # The final job downloads everything and creates the GitHub Release.

  build-linux:
    name: Build (Linux x86_64)
    runs-on: ubuntu-latest
    needs: build-vsix
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download VS Code extension .vsix
        uses: actions/download-artifact@v4
        with:
          name: vscode-extension-vsix
          path: editors/vscode/

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            gcc libgc-dev libcurl4-openssl-dev

      - name: Build amc (snapshot-driven bootstrap)
        run: |
          gcc -O2 -Iruntime snapshot/amc_lib.c \
              -lgc -lm -lcurl -o snapshot/amc
          ./build_amc.sh

      - name: Determine version
        id: ver
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          if [ -z "${REF#refs/*}" ] || [ "$REF" = "$GITHUB_REF" ]; then
            REF="${{ github.event.inputs.tag }}"
          fi
          VERSION="${REF#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building amc-$VERSION-linux-x86_64"

      - name: Stage release artifacts
        run: |
          NAME="amc-${{ steps.ver.outputs.version }}-linux-x86_64"
          # XDG-style layout (v0.8.1+): the tarball mirrors the
          # install-prefix tree so installers (install/install.sh,
          # install/windows/amalgame.iss) can `cp -r $NAME/* $PREFIX/`
          # with no per-file rewiring. amc's Program.ResolveRuntimeDir /
          # ResolveLibAmalgameA probe <bin>/../share/amalgame/{runtime,lib}
          # — match that exactly so $AMC_RUNTIME stays an opt-in
          # override, not a hard requirement.
          mkdir -p "dist/$NAME/bin"
          mkdir -p "dist/$NAME/share/amalgame/runtime"
          mkdir -p "dist/$NAME/share/amalgame/lib"
          mkdir -p "dist/$NAME/share/amalgame/docs/language"
          mkdir -p "dist/$NAME/share/amalgame/docs/guide"
          mkdir -p "dist/$NAME/share/amalgame/editors/vscode"
          cp amc                              "dist/$NAME/bin/"
          cp runtime/*.h                      "dist/$NAME/share/amalgame/runtime/"
          # Project F (v0.7.5+): pre-compiled user-facing stdlib.
          # build_amc.sh ran tools/build-stdlib.sh as Step 4, so
          # lib/libamalgame.a is already on disk.
          cp lib/libamalgame.a                "dist/$NAME/share/amalgame/lib/"
          cp README.md LICENSE                "dist/$NAME/"
          # Bundle the LLM-prompt source docs so `amc migrate / generate /
          # explain` find them at <exec-dir>/../share/amalgame/docs/...
          # (LoadDocsHeader lookup #1). Without these, the LLM commands
          # fall back to an inline conventions block — still functional
          # but the model loses access to the canonical grammar.
          cp docs/language/grammar.ebnf       "dist/$NAME/share/amalgame/docs/language/"
          cp docs/guide/02-language-tour.md   "dist/$NAME/share/amalgame/docs/guide/"
          # Latest VS Code extension .vsix — install.sh /
          # amalgame.iss auto-install it on detected editors so users
          # land on a working LSP + debug setup without extra steps.
          LATEST_VSIX=$(ls -1 editors/vscode/amalgame-*.vsix | sort -V | tail -n1)
          cp "$LATEST_VSIX" "dist/$NAME/share/amalgame/editors/vscode/"
          tar -czf "dist/$NAME.tar.gz" -C dist "$NAME"
          (cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 7

  build-macos:
    name: Build (macOS arm64)
    runs-on: macos-latest
    needs: build-vsix
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download VS Code extension .vsix
        uses: actions/download-artifact@v4
        with:
          name: vscode-extension-vsix
          path: editors/vscode/

      - name: Install build dependencies
        run: brew install bdw-gc curl

      - name: Build amc from tracked amc_lib.c
        run: |
          GC_PREFIX=$(brew --prefix bdw-gc)
          CURL_PREFIX=$(brew --prefix curl)
          gcc -O2 -Iruntime -I"$GC_PREFIX/include" -I"$CURL_PREFIX/include" \
              -L"$GC_PREFIX/lib" -L"$CURL_PREFIX/lib" \
              src/amc_lib.c \
              -lgc -lm -lcurl -o amc

      - name: Pre-compile user-facing stdlib (libamalgame.a)
        run: |
          GC_PREFIX=$(brew --prefix bdw-gc)
          CURL_PREFIX=$(brew --prefix curl)
          # tools/build-stdlib.sh defaults to plain `gcc -O2 -Iruntime`;
          # the macOS runner needs the homebrew prefixes spliced in.
          export CPPFLAGS="-I$GC_PREFIX/include -I$CURL_PREFIX/include"
          export LDFLAGS="-L$GC_PREFIX/lib -L$CURL_PREFIX/lib"
          ./tools/build-stdlib.sh

      - name: Determine version
        id: ver
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          if [ "$REF" = "$GITHUB_REF" ]; then
            REF="${{ github.event.inputs.tag }}"
          fi
          VERSION="${REF#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stage release artifacts
        run: |
          NAME="amc-${{ steps.ver.outputs.version }}-macos-arm64"
          # XDG-style layout — see linux job for rationale.
          mkdir -p "dist/$NAME/bin"
          mkdir -p "dist/$NAME/share/amalgame/runtime"
          mkdir -p "dist/$NAME/share/amalgame/lib"
          mkdir -p "dist/$NAME/share/amalgame/docs/language"
          mkdir -p "dist/$NAME/share/amalgame/docs/guide"
          mkdir -p "dist/$NAME/share/amalgame/editors/vscode"
          cp amc                              "dist/$NAME/bin/"
          cp runtime/*.h                      "dist/$NAME/share/amalgame/runtime/"
          cp lib/libamalgame.a                "dist/$NAME/share/amalgame/lib/"
          cp README.md LICENSE                "dist/$NAME/"
          cp docs/language/grammar.ebnf       "dist/$NAME/share/amalgame/docs/language/"
          cp docs/guide/02-language-tour.md   "dist/$NAME/share/amalgame/docs/guide/"
          LATEST_VSIX=$(ls -1 editors/vscode/amalgame-*.vsix | sort -V | tail -n1)
          cp "$LATEST_VSIX" "dist/$NAME/share/amalgame/editors/vscode/"
          tar -czf "dist/$NAME.tar.gz" -C dist "$NAME"
          (cd dist && shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 7

  build-windows:
    name: Build (Windows x86_64)
    runs-on: windows-latest
    needs: build-vsix
    timeout-minutes: 15
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Download VS Code extension .vsix
        uses: actions/download-artifact@v4
        with:
          name: vscode-extension-vsix
          path: editors/vscode/

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # libsystre wraps libtre to provide POSIX <regex.h> on MINGW64
          # (Linux glibc + macOS libSystem ship it natively, Windows
          # doesn't — needed since v0.7.1 by Amalgame_Regex.h). zlib is
          # needed by Amalgame_Compress.h since v0.7.2.
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gc
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-libsystre
            mingw-w64-x86_64-zlib
            zip

      - name: Build amc.exe from tracked amc_lib.c
        run: |
          gcc -O2 -Iruntime \
              src/amc_lib.c \
              -lgc -lm -lcurl -lz -lsystre -ltre -lws2_32 -lbcrypt -o amc.exe

      - name: Pre-compile user-facing stdlib (libamalgame.a)
        run: |
          # tools/build-stdlib.sh auto-detects ./amc vs ./amc.exe.
          ./tools/build-stdlib.sh

      - name: Determine version
        id: ver
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          if [ "$REF" = "$GITHUB_REF" ]; then
            REF="${{ github.event.inputs.tag }}"
          fi
          VERSION="${REF#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stage release artifacts
        run: |
          NAME="amc-${{ steps.ver.outputs.version }}-windows-x86_64"
          # XDG-style layout — see linux job for rationale.
          # Note: DLLs live alongside amc.exe in bin/ so the Windows
          # loader's default search path picks them up automatically
          # (current dir + PATH dirs; "bin/" being the only PATH dir
          # we install into keeps the resolution unambiguous).
          mkdir -p "dist/$NAME/bin"
          mkdir -p "dist/$NAME/share/amalgame/runtime"
          mkdir -p "dist/$NAME/share/amalgame/lib"
          mkdir -p "dist/$NAME/share/amalgame/docs/language"
          mkdir -p "dist/$NAME/share/amalgame/docs/guide"
          mkdir -p "dist/$NAME/share/amalgame/editors/vscode"
          cp amc.exe                          "dist/$NAME/bin/"
          cp runtime/*.h                      "dist/$NAME/share/amalgame/runtime/"
          cp lib/libamalgame.a                "dist/$NAME/share/amalgame/lib/"
          cp README.md LICENSE                "dist/$NAME/"
          cp docs/language/grammar.ebnf       "dist/$NAME/share/amalgame/docs/language/"
          cp docs/guide/02-language-tour.md   "dist/$NAME/share/amalgame/docs/guide/"
          LATEST_VSIX=$(ls -1 editors/vscode/amalgame-*.vsix | sort -V | tail -n1)
          cp "$LATEST_VSIX" "dist/$NAME/share/amalgame/editors/vscode/"
          # Bundle the MinGW DLLs the binary actually links against, so users
          # can run amc.exe without a separate MSYS2 install. libsystre +
          # libtre added v0.7.4 for POSIX <regex.h> (see install: above).
          for dll in libgc-1.dll libcurl-4.dll libwinpthread-1.dll \
                     libgcc_s_seh-1.dll libstdc++-6.dll \
                     zlib1.dll libssl-3-x64.dll libcrypto-3-x64.dll \
                     libbrotlicommon.dll libbrotlidec.dll \
                     libidn2-0.dll libpsl-5.dll libssh2-1.dll \
                     libnghttp2-14.dll libnghttp3-9.dll libngtcp2-16.dll \
                     libngtcp2_crypto_quictls.dll \
                     libiconv-2.dll libintl-8.dll libunistring-5.dll \
                     libzstd.dll \
                     libsystre-0.dll libtre-5.dll; do
            if [ -f "/mingw64/bin/$dll" ]; then
              cp "/mingw64/bin/$dll" "dist/$NAME/bin/"
            fi
          done
          (cd dist && zip -r "$NAME.zip" "$NAME")
          (cd dist && sha256sum "$NAME.zip" > "$NAME.zip.sha256")
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64
          path: |
            dist/*.zip
            dist/*.sha256
          retention-days: 7

  # Builds the Inno Setup .exe installer on top of the staged Windows tarball.
  # Runs natively on windows-latest (default pwsh) so choco + ISCC.exe work
  # without the msys2 wrapper the build-windows job uses. The installer
  # bundles a winlibs MinGW-w64 toolchain so `amc build` works on a fresh
  # box without MSYS2 — the same opt-in path documented in PUBLISHING.md.
  build-windows-installer:
    name: Build Windows .exe installer
    runs-on: windows-latest
    needs: build-windows
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}".Replace("refs/tags/", "")
          if ("$ref" -eq "${{ github.ref }}") { $ref = "${{ github.event.inputs.tag }}" }
          $version = $ref -replace '^v',''
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building installer for amc-$version"

      - name: Download Windows zip artifact
        uses: actions/download-artifact@v4
        with:
          name: release-windows-x86_64
          path: dist/

      - name: Extract Windows zip into staging tree
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath dist
          Get-ChildItem dist -Directory

      - name: Download winlibs MinGW-w64 (gcc-bundle source)
        shell: pwsh
        run: |
          # UCRT runtime, POSIX threads, SEH exceptions, GCC 13.2.0 —
          # matches what the build-windows job actually links against
          # (MSYS2 MINGW64), so the bundled gcc produces ABI-compatible
          # binaries with the bundled DLLs in {app}\bin.
          $url = 'https://github.com/brechtsanders/winlibs_mingw/releases/download/13.2.0posix-17.0.6-11.0.1-ucrt-r5/winlibs-x86_64-posix-seh-gcc-13.2.0-mingw-w64ucrt-11.0.1-r5.zip'
          Invoke-WebRequest -Uri $url -OutFile mingw.zip -UseBasicParsing
          Expand-Archive mingw.zip -DestinationPath winlibs-tmp
          # winlibs.zip extracts to mingw64/{bin,lib,...} — move it under
          # install/windows/gcc-bundle so amalgame.iss's #if FileExists
          # check picks it up.
          Move-Item winlibs-tmp\mingw64 install\windows\gcc-bundle
          Remove-Item -Recurse -Force winlibs-tmp, mingw.zip
          Test-Path install\windows\gcc-bundle\bin\gcc.exe

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress --version=6.2.2

      - name: Build amalgame-<ver>-setup.exe
        shell: pwsh
        working-directory: install\windows
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $stage = "..\..\dist\amc-$version-windows-x86_64"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAmcVersion=$version" "/DAmcStageDir=$stage" amalgame.iss
          Get-ChildItem Output

      - name: Hash the installer for checksums
        shell: pwsh
        working-directory: install\windows\Output
        run: |
          Get-ChildItem *.exe | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Encoding ascii "$($_.Name).sha256"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-installer
          path: |
            install/windows/Output/*.exe
            install/windows/Output/*.sha256
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [build-linux, build-macos, build-windows, build-windows-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR dist/

      - name: Aggregate checksums
        # Build checksums.sha256 in /tmp first, then move into dist/, so the
        # output file can never appear in the *.sha256 input glob (which
        # would make `cat` refuse with "input file is output file" — happens
        # on workflow re-runs that find an aggregate already in place).
        run: |
          rm -f dist/checksums.sha256
          cat dist/*.sha256 > /tmp/checksums.sha256
          mv /tmp/checksums.sha256 dist/checksums.sha256
          cat dist/checksums.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Amalgame ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
            dist/checksums.sha256
