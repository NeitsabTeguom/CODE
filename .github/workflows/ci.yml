name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Linux: full self-hosted pipeline. The snapshot bootstraps amc, the
  #    self-host build then re-bootstraps from src/, and the test runner
  #    exercises the freshly-built ./amc. Vala isn't installed here at
  #    all — to use the Vala recovery path, run ./compile.sh locally. ──
  linux:
    name: Build & test (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            gcc \
            libgc-dev \
            libcurl4-openssl-dev

      - name: Compile snapshot/amc from tracked snapshot/amc_lib.c
        run: |
          gcc -O2 -Iruntime \
              snapshot/amc_lib.c \
              -lgc -lm -lcurl -o snapshot/amc

      - name: Build self-hosted amc via build_amc.sh (uses snapshot)
        run: ./build_amc.sh

      - name: Verify amc reports its version
        run: ./amc --version

      - name: Run full test suite
        run: ./tests/run_all_tests.sh

      - name: Upload generated artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: amc-debug-linux
          path: |
            amc
            gen_test
            src/amc_lib.c
          retention-days: 3

  # ── macOS: skip Vala (no native Vala on macOS runners by default). Build amc
  #    directly from the tracked amc_lib.c — proves the snapshot is portable. ──
  macos:
    name: Build & test (macOS)
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install bdw-gc curl

      - name: Compile amc from tracked amc_lib.c
        run: |
          GC_PREFIX=$(brew --prefix bdw-gc)
          CURL_PREFIX=$(brew --prefix curl)
          gcc -O2 -Iruntime -I"$GC_PREFIX/include" -I"$CURL_PREFIX/include" \
              -L"$GC_PREFIX/lib" -L"$CURL_PREFIX/lib" \
              src/amc_lib.c \
              -lgc -lm -lcurl -o amc

      - name: Verify amc reports its version
        run: ./amc --version

      - name: Smoke compile a sample
        run: |
          GC_PREFIX=$(brew --prefix bdw-gc)
          CURL_PREFIX=$(brew --prefix curl)
          ./amc tests/samples/hello.am -o /tmp/hello
          gcc -Iruntime -I"$GC_PREFIX/include" -I"$CURL_PREFIX/include" \
              -L"$GC_PREFIX/lib" -L"$CURL_PREFIX/lib" \
              /tmp/hello.c -lgc -lm -lcurl -o /tmp/hello
          /tmp/hello

      - name: Upload generated artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: amc-debug-macos
          path: |
            amc
            src/amc_lib.c
          retention-days: 3

  # ── Windows: build via MSYS2 (gcc + libgc + libcurl available). Skips Vala
  #    for the same reason as macOS — the tracked amc_lib.c is the canonical
  #    cross-platform snapshot. ──
  windows:
    name: Build & test (Windows / MSYS2)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gc
            mingw-w64-x86_64-curl

      - name: Compile amc from tracked amc_lib.c
        run: |
          gcc -O2 -Iruntime \
              src/amc_lib.c \
              -lgc -lm -lcurl -lws2_32 -o amc.exe

      - name: Verify amc reports its version
        run: ./amc.exe --version

      - name: Smoke compile a sample
        run: |
          ./amc.exe tests/samples/hello.am -o /tmp/hello
          gcc -Iruntime /tmp/hello.c -lgc -lm -lcurl -lws2_32 -o /tmp/hello.exe
          /tmp/hello.exe

      - name: Upload generated artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: amc-debug-windows
          path: |
            amc.exe
            src/amc_lib.c
          retention-days: 3
